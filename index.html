<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Portfolio Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .fade-in {
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .importance-high {
            border-left: 4px solid #ef4444;
        }
        
        .importance-medium {
            border-left: 4px solid #f59e0b;
        }
        
        .importance-low {
            border-left: 4px solid #10b981;
        }
        
        .image-preview {
            max-height: 200px;
            object-fit: cover;
        }
        
        .upload-area {
            border: 2px dashed #d1d5db;
            transition: all 0.3s ease;
        }
        
        .upload-area.dragover {
            border-color: #4f46e5;
            background-color: #f0f4ff;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-indigo-700 mb-2">Project Portfolio Manager</h1>
            <p class="text-gray-600">Track and organize projects for your portfolio</p>
        </header>

        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Column - Add Project Form -->
            <div class="lg:col-span-1 bg-white rounded-lg shadow-md p-6 h-fit">
                <h2 class="text-2xl font-semibold text-gray-800 mb-6">Add New Project</h2>
                
                <form id="projectForm" class="space-y-4">
                    <div>
                        <label for="projectName" class="block text-sm font-medium text-gray-700 mb-1">Project Name</label>
                        <input type="text" id="projectName" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    
                    <div>
                        <label for="projectDate" class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                        <input type="date" id="projectDate" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    
                    <div class="flex space-x-4">
                        <div class="w-1/2">
                            <label for="projectCategory" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                            <select id="projectCategory" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                <!-- Categories will be populated by JavaScript -->
                            </select>
                        </div>
                        
                        <div class="w-1/2">
                            <label for="projectImportance" class="block text-sm font-medium text-gray-700 mb-1">Importance</label>
                            <select id="projectImportance" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                <option value="high">High</option>
                                <option value="medium">Medium</option>
                                <option value="low">Low</option>
                            </select>
                        </div>
                    </div>
                    
                    <div>
                        <label for="projectDescription" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                        <textarea id="projectDescription" rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                    </div>
                    
                    <!-- Image Upload Section -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Thumbnail Image</label>
                        <div id="uploadArea" class="upload-area rounded-md p-4 text-center cursor-pointer">
                            <div id="uploadContent">
                                <i class="fas fa-cloud-upload-alt text-3xl text-gray-400 mb-2"></i>
                                <p class="text-sm text-gray-600">Click to upload or drag and drop</p>
                                <p class="text-xs text-gray-500 mt-1">PNG, JPG up to 5MB</p>
                            </div>
                            <input type="file" id="thumbnailUpload" accept="image/*" class="hidden">
                            <div id="imagePreview" class="hidden mt-4">
                                <img id="previewImage" class="image-preview w-full rounded-md">
                                <button type="button" id="removeImage" class="mt-2 text-red-600 hover:text-red-800 text-sm">
                                    <i class="fas fa-times mr-1"></i> Remove Image
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex space-x-4">
                        <button type="submit" class="flex-1 bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition duration-200 font-medium">
                            Add Project
                        </button>
                        
                        <button type="button" id="resetForm" class="flex-1 bg-gray-200 text-gray-800 py-2 px-4 rounded-md hover:bg-gray-300 transition duration-200 font-medium">
                            Reset
                        </button>
                    </div>
                </form>
                
                <!-- Add New Category -->
                <div class="mt-8 pt-6 border-t border-gray-200">
                    <h3 class="text-lg font-medium text-gray-800 mb-3">Add New Category</h3>
                    <div class="flex space-x-2">
                        <input type="text" id="newCategory" placeholder="Category name" class="flex-1 px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <button id="addCategory" class="bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 transition duration-200">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Right Column - Project List and Filters -->
            <div class="lg:col-span-2">
                <!-- Filters -->
                <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                    <div class="flex flex-wrap gap-4 items-center">
                        <div>
                            <label for="filterCategory" class="block text-sm font-medium text-gray-700 mb-1">Filter by Category</label>
                            <select id="filterCategory" class="px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                <option value="all">All Categories</option>
                                <!-- Categories will be populated by JavaScript -->
                            </select>
                        </div>
                        
                        <div>
                            <label for="filterImportance" class="block text-sm font-medium text-gray-700 mb-1">Filter by Importance</label>
                            <select id="filterImportance" class="px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                <option value="all">All Importance Levels</option>
                                <option value="high">High</option>
                                <option value="medium">Medium</option>
                                <option value="low">Low</option>
                            </select>
                        </div>
                        
                        <div class="ml-auto">
                            <button id="clearFilters" class="bg-gray-200 text-gray-800 py-2 px-4 rounded-md hover:bg-gray-300 transition duration-200 font-medium">
                                Clear Filters
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Projects List -->
                <div id="projectsList" class="space-y-6">
                    <!-- Projects will be displayed here -->
                </div>
                
                <!-- Empty State -->
                <div id="emptyState" class="text-center py-12 bg-white rounded-lg shadow-md">
                    <i class="fas fa-folder-open text-5xl text-gray-300 mb-4"></i>
                    <h3 class="text-xl font-medium text-gray-700 mb-2">No projects yet</h3>
                    <p class="text-gray-500 mb-6">Add your first project to get started!</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize data
        let projects = JSON.parse(localStorage.getItem('portfolioProjects')) || [];
        let categories = JSON.parse(localStorage.getItem('portfolioCategories')) || [
            'Web Development', 'Mobile App', 'Design', 'Research', 'Other'
        ];

        // DOM Elements
        const projectForm = document.getElementById('projectForm');
        const projectsList = document.getElementById('projectsList');
        const emptyState = document.getElementById('emptyState');
        const projectCategorySelect = document.getElementById('projectCategory');
        const filterCategorySelect = document.getElementById('filterCategory');
        const newCategoryInput = document.getElementById('newCategory');
        const addCategoryBtn = document.getElementById('addCategory');
        const resetFormBtn = document.getElementById('resetForm');
        const filterImportanceSelect = document.getElementById('filterImportance');
        const clearFiltersBtn = document.getElementById('clearFilters');
        
        // Image upload elements
        const uploadArea = document.getElementById('uploadArea');
        const uploadContent = document.getElementById('uploadContent');
        const thumbnailUpload = document.getElementById('thumbnailUpload');
        const imagePreview = document.getElementById('imagePreview');
        const previewImage = document.getElementById('previewImage');
        const removeImageBtn = document.getElementById('removeImage');

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            updateCategorySelects();
            renderProjects();
            setMinDate();
            
            // Set today's date as default
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('projectDate').value = today;
            
            // Initialize image upload functionality
            initImageUpload();
        });

        // Initialize image upload functionality
        function initImageUpload() {
            // Click on upload area to trigger file input
            uploadArea.addEventListener('click', function() {
                thumbnailUpload.click();
            });
            
            // Handle file selection
            thumbnailUpload.addEventListener('change', function(e) {
                if (this.files && this.files[0]) {
                    const file = this.files[0];
                    
                    // Validate file type
                    if (!file.type.match('image.*')) {
                        showNotification('Please select an image file!', 'error');
                        return;
                    }
                    
                    // Validate file size (5MB)
                    if (file.size > 5 * 1024 * 1024) {
                        showNotification('Image size should be less than 5MB!', 'error');
                        return;
                    }
                    
                    const reader = new FileReader();
                    
                    reader.onload = function(e) {
                        previewImage.src = e.target.result;
                        uploadContent.classList.add('hidden');
                        imagePreview.classList.remove('hidden');
                    }
                    
                    reader.readAsDataURL(file);
                }
            });
            
            // Remove image
            removeImageBtn.addEventListener('click', function(e) {
                e.stopPropagation(); // Prevent triggering upload area click
                thumbnailUpload.value = '';
                imagePreview.classList.add('hidden');
                uploadContent.classList.remove('hidden');
            });
            
            // Drag and drop functionality
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            
            uploadArea.addEventListener('dragleave', function() {
                uploadArea.classList.remove('dragover');
            });
            
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    const file = e.dataTransfer.files[0];
                    
                    // Validate file type
                    if (!file.type.match('image.*')) {
                        showNotification('Please drop an image file!', 'error');
                        return;
                    }
                    
                    // Validate file size (5MB)
                    if (file.size > 5 * 1024 * 1024) {
                        showNotification('Image size should be less than 5MB!', 'error');
                        return;
                    }
                    
                    // Create a new FileList to set to the input
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(file);
                    thumbnailUpload.files = dataTransfer.files;
                    
                    // Trigger change event
                    const event = new Event('change', { bubbles: true });
                    thumbnailUpload.dispatchEvent(event);
                }
            });
        }

        // Set minimum date to today
        function setMinDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('projectDate').setAttribute('min', today);
        }

        // Update category dropdowns
        function updateCategorySelects() {
            // Clear existing options
            projectCategorySelect.innerHTML = '';
            filterCategorySelect.innerHTML = '<option value="all">All Categories</option>';
            
            // Add categories to both selects
            categories.forEach(category => {
                const option1 = document.createElement('option');
                option1.value = category;
                option1.textContent = category;
                projectCategorySelect.appendChild(option1);
                
                const option2 = document.createElement('option');
                option2.value = category;
                option2.textContent = category;
                filterCategorySelect.appendChild(option2);
            });
            
            // Save categories to localStorage
            localStorage.setItem('portfolioCategories', JSON.stringify(categories));
        }

        // Add new category
        addCategoryBtn.addEventListener('click', function() {
            const newCategory = newCategoryInput.value.trim();
            
            if (newCategory && !categories.includes(newCategory)) {
                categories.push(newCategory);
                updateCategorySelects();
                newCategoryInput.value = '';
                
                // Show success message
                showNotification('Category added successfully!', 'success');
            } else if (categories.includes(newCategory)) {
                showNotification('Category already exists!', 'error');
            } else {
                showNotification('Please enter a category name!', 'error');
            }
        });

        // Add new project
        projectForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const projectName = document.getElementById('projectName').value;
            const projectDate = document.getElementById('projectDate').value;
            const projectCategory = document.getElementById('projectCategory').value;
            const projectImportance = document.getElementById('projectImportance').value;
            const projectDescription = document.getElementById('projectDescription').value;
            
            // Check if an image is uploaded
            let thumbnailData = '';
            if (thumbnailUpload.files && thumbnailUpload.files[0]) {
                const file = thumbnailUpload.files[0];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    thumbnailData = e.target.result;
                    saveProject(projectName, projectDate, projectCategory, projectImportance, projectDescription, thumbnailData);
                };
                
                reader.readAsDataURL(file);
            } else {
                // Use a placeholder image if no image is uploaded
                thumbnailData = 'https://via.placeholder.com/300x200/4f46e5/ffffff?text=No+Image';
                saveProject(projectName, projectDate, projectCategory, projectImportance, projectDescription, thumbnailData);
            }
        });

        // Save project to localStorage
        function saveProject(name, date, category, importance, description, thumbnail) {
            const project = {
                id: Date.now(), // Simple ID generation
                name: name,
                date: date,
                category: category,
                importance: importance,
                description: description,
                thumbnail: thumbnail
            };
            
            projects.push(project);
            localStorage.setItem('portfolioProjects', JSON.stringify(projects));
            
            renderProjects();
            resetForm();
            showNotification('Project added successfully!', 'success');
        }

        // Reset form
        function resetForm() {
            projectForm.reset();
            setMinDate();
            
            // Set today's date as default
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('projectDate').value = today;
            
            // Reset image upload
            thumbnailUpload.value = '';
            imagePreview.classList.add('hidden');
            uploadContent.classList.remove('hidden');
        }

        // Reset form button
        resetFormBtn.addEventListener('click', resetForm);

        // Render projects
        function renderProjects() {
            const filterCategory = filterCategorySelect.value;
            const filterImportance = filterImportanceSelect.value;
            
            // Filter projects
            let filteredProjects = projects;
            
            if (filterCategory !== 'all') {
                filteredProjects = filteredProjects.filter(project => project.category === filterCategory);
            }
            
            if (filterImportance !== 'all') {
                filteredProjects = filteredProjects.filter(project => project.importance === filterImportance);
            }
            
            // Show/hide empty state
            if (filteredProjects.length === 0) {
                emptyState.classList.remove('hidden');
                projectsList.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                projectsList.classList.remove('hidden');
                
                // Clear projects list
                projectsList.innerHTML = '';
                
                // Add projects to the list
                filteredProjects.forEach(project => {
                    const projectCard = document.createElement('div');
                    projectCard.className = `bg-white rounded-lg shadow-md p-6 fade-in importance-${project.importance}`;
                    
                    // Format date
                    const dateObj = new Date(project.date);
                    const formattedDate = dateObj.toLocaleDateString('en-US', { 
                        year: 'numeric', 
                        month: 'long', 
                        day: 'numeric' 
                    });
                    
                    // Importance badge
                    let importanceBadge = '';
                    if (project.importance === 'high') {
                        importanceBadge = '<span class="bg-red-100 text-red-800 text-xs font-medium px-2.5 py-0.5 rounded">High Priority</span>';
                    } else if (project.importance === 'medium') {
                        importanceBadge = '<span class="bg-yellow-100 text-yellow-800 text-xs font-medium px-2.5 py-0.5 rounded">Medium Priority</span>';
                    } else {
                        importanceBadge = '<span class="bg-green-100 text-green-800 text-xs font-medium px-2.5 py-0.5 rounded">Low Priority</span>';
                    }
                    
                    projectCard.innerHTML = `
                        <div class="flex flex-col md:flex-row gap-6">
                            <div class="md:w-1/3">
                                <img src="${project.thumbnail}" alt="${project.name}" class="w-full h-48 object-cover rounded-lg">
                            </div>
                            <div class="md:w-2/3">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="text-xl font-bold text-gray-800">${project.name}</h3>
                                    ${importanceBadge}
                                </div>
                                <div class="flex items-center text-sm text-gray-600 mb-4">
                                    <i class="fas fa-calendar-alt mr-2"></i>
                                    <span class="mr-4">${formattedDate}</span>
                                    <i class="fas fa-folder mr-2"></i>
                                    <span>${project.category}</span>
                                </div>
                                <p class="text-gray-700 mb-4">${project.description}</p>
                                <div class="flex justify-end">
                                    <button class="text-red-600 hover:text-red-800 delete-project" data-id="${project.id}">
                                        <i class="fas fa-trash-alt mr-1"></i> Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    projectsList.appendChild(projectCard);
                });
                
                // Add event listeners to delete buttons
                document.querySelectorAll('.delete-project').forEach(button => {
                    button.addEventListener('click', function() {
                        const projectId = parseInt(this.getAttribute('data-id'));
                        deleteProject(projectId);
                    });
                });
            }
        }

        // Delete project
        function deleteProject(id) {
            if (confirm('Are you sure you want to delete this project?')) {
                projects = projects.filter(project => project.id !== id);
                localStorage.setItem('portfolioProjects', JSON.stringify(projects));
                renderProjects();
                showNotification('Project deleted successfully!', 'success');
            }
        }

        // Filter projects when filter changes
        filterCategorySelect.addEventListener('change', renderProjects);
        filterImportanceSelect.addEventListener('change', renderProjects);

        // Clear filters
        clearFiltersBtn.addEventListener('click', function() {
            filterCategorySelect.value = 'all';
            filterImportanceSelect.value = 'all';
            renderProjects();
        });

        // Show notification
        function showNotification(message, type) {
            // Remove existing notification if any
            const existingNotification = document.querySelector('.notification');
            if (existingNotification) {
                existingNotification.remove();
            }
            
            // Create notification element
            const notification = document.createElement('div');
            notification.className = `notification fixed top-4 right-4 px-6 py-3 rounded-md shadow-lg text-white font-medium z-50 fade-in ${
                type === 'success' ? 'bg-green-500' : 'bg-red-500'
            }`;
            notification.textContent = message;
            
            // Add to page
            document.body.appendChild(notification);
            
            // Remove after 3 seconds
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    </script>
</body>
</html>
